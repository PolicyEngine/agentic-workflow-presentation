name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scrolly-blog/package-lock.json

      - name: Install dependencies
        working-directory: scrolly-blog
        run: npm ci

      - name: Build
        working-directory: scrolly-blog
        run: npm run build

      - name: Copy root HTML files into build output
        run: cp *.html scrolly-blog/dist/

      - name: Add plugin-blog route for GitHub Pages
        run: mkdir -p scrolly-blog/dist/plugin-blog && cp scrolly-blog/dist/index.html scrolly-blog/dist/plugin-blog/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scrolly-blog/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
